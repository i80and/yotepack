[package]
name = "yotepack"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "s"
lto = "fat"

[dependencies]
anyhow = { version = "1.0.101", features = ["backtrace"] }
camino = "1.2.2"
capnp = "0.25.0"
clap = { version = "4.5.57", features = ["derive"] }
dashmap = "6.1.0"
derive = "1.0.0"
features = "0.10.0"
reed-solomon-simd = "3.1.0"
serde = { version = "1.0.228", features = ["derive"] }
threadpool = "1.8.1"
toml = "0.9.11"
uuid = { version = "1.20.0", features = ["rng-getrandom", "serde", "v4"] }
xattr = "1.6.1"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = { version = "0.13.3", features = ["fat-lto"] }

[build-dependencies]
capnpc = "0.25.0"

[dev-dependencies]
tempfile = "3.25.0"
